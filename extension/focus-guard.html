<!doctype html>
<!-- Canvas Harness distraction guard: the page where the student lets Chrome give the guard access to other websites.
     Opened as its own small window by the focus room's "Allow in Chrome" (through background.js), because Chrome asks
     most reliably from an extension page of its own, and only after the student's own click here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distraction guard</title>
<style>
 :root{color-scheme:light;--paper:#FAF9F5;--ink:#1F1E1B;--muted:#6E6B62;--line:#E2DED3;--accent:#C96442}
 @media (prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#16191f;--ink:#F7F5EF;--muted:#A9A69C;--line:#2E343E}}
 html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
 body{display:grid;place-items:center;min-height:100vh;padding:22px;box-sizing:border-box;font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
 main{max-width:360px;display:grid;gap:12px}
 .eyebrow{margin:0;font:600 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
 h1{margin:0;font:500 22px/1.25 "Literata",Georgia,serif}
 p{margin:0;color:var(--muted)}
 .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
 button{font:600 14px/1 "Segoe UI",system-ui,sans-serif;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
 button.primary{background:var(--accent);border-color:transparent;color:#fff}
 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
 button[hidden]{display:none}
 #status{color:var(--ink);min-height:1.5em}
</style>
</head>
<body>
<main>
 <p class="eyebrow">Canvas Harness · Focus room</p>
 <h1>Let the distraction guard work</h1>
 <p>To cover the sites on your list while you focus, Canvas Harness needs Chrome’s access to other websites. It uses it only on the sites you listed, only while a focus session runs, and never on Canvas.</p>
 <p id="status" role="status"></p>
 <div class="row"><button type="button" class="primary" id="allow">Allow in Chrome</button><button type="button" id="close">Not now</button></div>
</main>
<script src="focus-guard-allow.js"></script>
</body>
</html>
