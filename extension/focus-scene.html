<!doctype html>
<!-- Canvas Harness focus room backdrop: the moving scene, the student's own photo or video, and the room's sounds.
     An extension page framed by the focus room (focus-room.js), so a student's own files stay in the extension's
     storage on this device and never reach the Canvas page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus room backdrop</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:transparent}
 canvas,img,video{position:fixed;inset:0;width:100%;height:100%;display:block;object-fit:cover}
 [hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<img id="photo" alt="" hidden>
<video id="video" muted loop playsinline hidden></video>
<audio id="own" loop hidden></audio>
<script src="site.js"></script>
<script src="focus-room-model.js"></script>
<script src="focus-scene-renderer.js"></script>
<script src="focus-scene.js"></script>
</body>
</html>
