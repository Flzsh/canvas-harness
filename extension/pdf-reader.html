<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas Harness PDF reader</title>
  <link rel="stylesheet" href="pdf-art.css">
  <link rel="stylesheet" href="pdf-reader.css">
  <script src="pdf-art.js" defer></script>
  <script src="pdf-model.js" defer></script>
  <script src="pdf-export.js" defer></script>
  <script src="pdf-reader.js" defer></script>
</head>
<body>
  <header class="paper-strip">
    <div class="document-heading"><span id="file-name">PDF reader</span><span id="heading-actions"></span></div>
    <div id="toolbar" role="toolbar" aria-label="PDF tools"></div>
    <div id="find-bar" hidden role="search">
      <label for="find-input">Find in document</label><input id="find-input" type="search" autocomplete="off">
      <span id="find-count" aria-live="polite"></span><span id="find-actions"></span>
    </div>
  </header>
  <div id="status" role="status" aria-live="polite">Opening your document…</div>
  <main id="reader-layout">
    <aside id="side-view" hidden aria-label="Document navigation">
      <div class="side-tabs" role="tablist" aria-label="Navigation view">
        <button id="thumbnails-tab" role="tab" aria-selected="true" aria-controls="thumbnails">Pages</button>
        <button id="outline-tab" role="tab" aria-selected="false" aria-controls="outline" hidden>Outline</button>
      </div>
      <nav id="thumbnails" role="tabpanel" aria-labelledby="thumbnails-tab"></nav>
      <nav id="outline" role="tabpanel" aria-labelledby="outline-tab" hidden></nav>
    </aside>
    <div id="page-scroll" tabindex="0" role="region" aria-label="PDF pages"><div id="pages"></div></div>
  </main>
  <div id="pen-palette" class="paper-popover" hidden role="group" aria-label="Highlight colour"></div>
  <div id="selection-menu" class="paper-popover" hidden role="toolbar" aria-label="Selected text actions"></div>
  <dialog id="note-editor" aria-labelledby="note-title">
    <form method="dialog"><h2 id="note-title">A note in the margin</h2><label for="note-text">Your note, saved on this device</label>
      <textarea id="note-text" maxlength="10000" rows="7"></textarea>
      <div class="note-actions"><button value="cancel">Cancel</button><button id="save-note" value="save">Save note</button></div>
    </form>
  </dialog>
</body>
</html>
