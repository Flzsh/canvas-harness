<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Soul Passage band</title>
<!-- The Train Cabin's travelling band, as a page of its own. The dashboard shows it in a frame over its band
     (scene-themes.js frameBand), so the band's hundreds of movements run here, in the extension's own process, and cost
     the dashboard's frames nothing. The engine is the dashboard's own (scene-themes.js skyBand and bandRide, band-kit.js);
     band.js only passes on what the dashboard says (the moment) and what the band answers (laid, tone, stage, failure).
     Nothing is stored, nothing is read but this folder's pictures. -->
<meta name="color-scheme" content="normal">
<link rel="stylesheet" href="theme.css">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
.tk-host{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;pointer-events:none}
.tk-host > .tk-band{position:absolute;left:0;top:0;width:100%;height:100%}
</style></head>
<body><div class="rd" data-theme-kit="train" data-theme-kit-ready style="position:fixed;left:0;top:0;width:100vw;height:100vh;margin:0!important;padding:0!important;background:none!important;overflow:hidden"><div class="tk-host" aria-hidden="true"></div></div>
<script src="../../band-kit.js"></script>
<script src="../../scene-themes.js"></script>
<script src="band.js"></script></body></html>
